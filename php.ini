; 1998.ini -- what php.ini looked like when this application was written.
;
; short_open_tag was On by default, and everybody used <? and <?= .
short_open_tag = On

; Errors went straight to the browser. So did your database password, if you
; were careless with an include path.
display_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED

; ereg(), each() and mysql_*() are the period API. Modern PHP grumbles about
; all three; in 1998 they were simply the way you did it.
date.timezone = America/Los_Angeles

; magic_quotes_gpc was On in 1998 and was removed from PHP in 5.4, so this
; code calls addslashes() explicitly instead of relying on it.
