# .php3 was the extension. "PHP 3" was in the name of the file you linked to,
# and changing it later broke everybody's bookmarks.
<FilesMatch "\.php3$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php3 index.html

# The include files are not meant to be fetched directly.
<FilesMatch "\.inc$">
    Require all denied
</FilesMatch>
